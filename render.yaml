services:
  - type: web
    name: telegram-digital-store-bot
    env: node
    buildCommand: (mkdir -p /opt/render/project/bin && curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /opt/render/project/bin/yt-dlp && chmod a+rx /opt/render/project/bin/yt-dlp) || true; cd store-bot/backend && npm install && cd ../admin-dashboard && npm install && npm run build
    startCommand: cd store-bot/backend && npm start
    envVars:
      - key: PORT
        value: 10000
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_ID
        sync: false
      - key: ADMIN_SECRET_KEY
        generateValue: true
      - key: BAKONG_ACCOUNT_ID
        value: merchant@acleda
      - key: BAKONG_MERCHANT_NAME
        value: KHMER DIGITAL STORE
      - key: REFERRAL_COMMISSION_PERCENT
        value: 10
      - key: YTDLP_PATH
        value: /opt/render/project/bin/yt-dlp

